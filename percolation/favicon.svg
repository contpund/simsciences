<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0d0d0f"/>
  <!-- the rock: a coarse lattice of closed sites -->
  <g fill="#2e3444">
    <rect x="10" y="18" width="8" height="8"/><rect x="28" y="18" width="8" height="8"/>
    <rect x="46" y="18" width="8" height="8"/><rect x="19" y="27" width="8" height="8"/>
    <rect x="46" y="27" width="8" height="8"/><rect x="10" y="36" width="8" height="8"/>
    <rect x="37" y="36" width="8" height="8"/><rect x="19" y="45" width="8" height="8"/>
    <rect x="46" y="45" width="8" height="8"/>
  </g>
  <!-- the one wet path, top to bottom -->
  <g fill="#5fb0ff">
    <rect x="37" y="10" width="8" height="8"/><rect x="37" y="18" width="8" height="8"/>
    <rect x="28" y="27" width="8" height="8"/><rect x="37" y="27" width="8" height="8"/>
    <rect x="28" y="36" width="8" height="8"/>
  </g>
  <g fill="#78ffd6">
    <rect x="28" y="45" width="8" height="8"/><rect x="28" y="52" width="8" height="4" rx="1"/>
  </g>
  <!-- inlet bar -->
  <rect x="8" y="6" width="48" height="3" rx="1.5" fill="#5fb0ff"/>
</svg>
