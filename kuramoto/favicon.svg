<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="12" fill="#0d0d0f"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#2a2a31" stroke-width="2"/>
  <!-- a locked arc of oscillators, top-right -->
  <g fill="#78ffd6">
    <circle cx="52" cy="26" r="2.4"/><circle cx="50" cy="18" r="2.4"/>
    <circle cx="45" cy="12" r="2.4"/><circle cx="38" cy="10" r="2.4"/>
  </g>
  <!-- a few stragglers, still drifting -->
  <g fill="#5fb0ff">
    <circle cx="12" cy="38" r="2.2"/><circle cx="20" cy="52" r="2.2"/>
  </g>
  <g fill="#ffae45">
    <circle cx="16" cy="24" r="2.2"/><circle cx="30" cy="54" r="2.2"/>
  </g>
  <!-- the order-parameter arrow -->
  <line x1="32" y1="32" x2="46" y2="18" stroke="#78ffd6" stroke-width="3" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2.5" fill="#e8e9ee"/>
</svg>
