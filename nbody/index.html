<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Problème à N corps — SimSciences</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1 data-i18n="appTitle">Problème à N corps</h1>
      <span class="subtitle" data-i18n="subtitle">Comment une galaxie naît de la seule loi de Newton</span>
    </div>
    <nav class="lang" aria-label="Language" data-i18n-tip="tip.lang">
      <button data-lang="fr" lang="fr" title="Français">🇫🇷</button>
      <button data-lang="en" lang="en" title="English">🇬🇧</button>
    </nav>
  </header>

  <main class="layout">
    <section class="stage">
      <canvas id="sim" width="800" height="600"></canvas>
      <div class="citation" data-i18n="citation">Newton, I. (1687). Philosophiæ Naturalis Principia Mathematica.</div>
    </section>

    <aside class="sidebar">
      <section class="panel">
        <h2 data-i18n="sectionParams">Paramètres</h2>

        <div class="ctrl">
          <label for="slN"><span data-i18n="nbody">N (nombre d'étoiles)</span><b id="valN">600</b></label>
          <input type="range" id="slN" min="100" max="1500" step="50" value="600" data-i18n-tip="tip.nbody" />
        </div>
        <div class="ctrl">
          <label for="slG"><span data-i18n="gravity">G (gravité)</span><b id="valG">1.00</b></label>
          <input type="range" id="slG" min="0.1" max="3" step="0.05" value="1" data-i18n-tip="tip.gravity" />
        </div>
        <div class="ctrl">
          <label for="slSpin"><span data-i18n="spin">Vitesse initiale (rotation)</span><b id="valSpin">1.00×</b></label>
          <input type="range" id="slSpin" min="0" max="1.5" step="0.05" value="1" data-i18n-tip="tip.spin" />
        </div>
        <div class="ctrl">
          <label for="slSoft"><span data-i18n="soft">ε (adoucissement)</span><b id="valSoft">16.0</b></label>
          <input type="range" id="slSoft" min="2" max="40" step="0.5" value="16" data-i18n-tip="tip.soft" />
        </div>
        <div class="ctrl">
          <label for="slSpeed"><span data-i18n="speed">Vitesse</span><b id="valSpeed">1.00×</b></label>
          <input type="range" id="slSpeed" min="0.25" max="2.5" step="0.05" value="1" data-i18n-tip="tip.speed" />
        </div>
      </section>

      <section class="panel">
        <h2 data-i18n="sectionOptions">Options</h2>
        <label class="toggle" data-i18n-tip="tip.trails">
          <input type="checkbox" id="tgTrails" checked />
          <span data-i18n="trails">Traînées de mouvement</span>
        </label>
        <label class="toggle" data-i18n-tip="tip.colorByRadius">
          <input type="checkbox" id="tgColor" checked />
          <span data-i18n="colorByRadius">Couleur galactique</span>
        </label>
      </section>

      <section class="panel">
        <h2 data-i18n="sectionPresets">Configurations initiales</h2>
        <div class="presets">
          <button id="btnGalaxy" data-i18n="presetGalaxy" data-i18n-tip="tip.presetGalaxy">Galaxie spirale</button>
          <button id="btnCollision" data-i18n="presetCollision" data-i18n-tip="tip.presetCollision">Collision</button>
          <button id="btnCollapse" data-i18n="presetCollapse" data-i18n-tip="tip.presetCollapse">Effondrement</button>
          <button id="btnCluster" data-i18n="presetCluster" data-i18n-tip="tip.presetCluster">Amas</button>
          <button id="btnReset" class="ghost" data-i18n="reset" data-i18n-tip="tip.reset">Réinitialiser</button>
        </div>
        <button id="btnPause" class="wide" data-i18n="start" data-i18n-tip="tip.pause">⏸ Pause</button>
      </section>
    </aside>
  </main>
</body>
</html>
